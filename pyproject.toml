[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "doribt"
version = "0.3.0"
description = "Daily and minute cash-account backtesting for A-share research"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "DoriBT contributors"}]
dependencies = ["numpy>=2.0,<3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Documentation = "https://dorislab.github.io/DoriBT/"
Repository = "https://github.com/DorisLab/DoriBT"
Issues = "https://github.com/DorisLab/DoriBT/issues"

[project.optional-dependencies]
numba = ["numba>=0.61,<0.69"]
plot = ["matplotlib>=3.10,<4"]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "matplotlib>=3.10,<4",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "psutil>=7,<8",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-psutil>=7.2.2.20260906",
]
docs = [
    "furo>=2025",
    "jieba>=0.42.1,<0.43",
    "myst-parser>=4,<6",
    "sphinx>=8.2,<9",
    "sphinx-copybutton>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = ["numba: requires the optional Numba backend (must pass in the numba job)"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.doribt.quality]
max-file-lines = 400

[tool.mypy]
python_version = "3.13"
files = ["src", "examples", "scripts", "benchmarks"]
strict = true

[[tool.mypy.overrides]]
module = ["numba", "numba.extending"]
# Numba does not ship typing stubs. Only this optional library boundary is untyped.
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["doribt"]

[tool.coverage.report]
show_missing = true
skip_empty = true
