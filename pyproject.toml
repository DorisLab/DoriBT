[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
# 工程记录及残留开发产物不进入 wheel 或 sdist；工程历史保留在 Git 仓库。
exclude = ["/engineering/**", "**/*.so", "**/*.pyd", "**/*.dll", "**/*.dylib", "**/*.o", "**/*.a"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[project]
name = "doribt"
version = "0.6.2"
description = "A-share and ETF backtesting with historical rules, shared cash and auditable reports"
keywords = ["backtesting", "quantitative-finance", "a-share", "etf", "numba"]
readme = "README.md"
requires-python = ">=3.13,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "DoriBT contributors"}]
dependencies = [
    "numpy>=2.1,<3; python_version < '3.14'",
    "numpy>=2.3.3,<3; python_version == '3.14'",
    "numpy>=2.5.2,<3; python_version >= '3.15'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Documentation = "https://dorislab.github.io/DoriBT/"
Repository = "https://github.com/DorisLab/DoriBT"
Issues = "https://github.com/DorisLab/DoriBT/issues"

[project.optional-dependencies]
numba = [
    "numba>=0.61,<0.69; python_version < '3.14'",
    "numba>=0.63,<0.69; python_version == '3.14'",
    "numba>=0.68,<0.69; python_version >= '3.15'",
]
plot = ["matplotlib>=3.10,<4"]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "matplotlib>=3.10,<4",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "psutil>=7,<8",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-psutil>=7.2.2.20260906",
]
docs = [
    "furo>=2025",
    "jieba>=0.42.1,<0.43",
    "myst-parser>=4,<6",
    "sphinx>=8.2,<9",
    "sphinx-copybutton>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = ["numba: requires the optional Numba backend (must pass in the numba job)"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.doribt.quality]
max-file-lines = 400

[tool.mypy]
python_version = "3.13"
files = ["src", "examples", "scripts", "benchmarks"]
strict = true

[[tool.mypy.overrides]]
module = ["numba", "numba.extending"]
# Numba does not ship typing stubs. Only this optional library boundary is untyped.
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["doribt"]

[tool.coverage.report]
show_missing = true
skip_empty = true
