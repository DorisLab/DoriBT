name: Milestone CI

on:
  push:
    tags:
      - 'milestone/**'
      - '!milestone/docs/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: check (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.backend }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        backend: [python, numba]
        python: ['3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.0
      - if: matrix.backend == 'python'
        run: uv sync --locked --python ${{ matrix.python }}
      - if: matrix.backend == 'numba'
        run: uv sync --locked --extra numba --python ${{ matrix.python }}
      - run: uv run --no-sync python scripts/check.py --backend ${{ matrix.backend }}

  native:
    name: native records (Linux x86_64, Python ${{ matrix.python }}, Numba)
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14', '3.15']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.0
      - run: uv sync --locked --extra numba --python ${{ matrix.python }}
      - name: 从当前源码构建并强制验证原生路径
        run: uv run --no-sync python scripts/build_native.py --inplace
      - run: uv run --no-sync python -m pytest
        env:
          DORIBT_NATIVE_RECORDS: required
      - name: 从 sdist 验证纯包与原生包的隔离安装
        run: uv run --no-sync python scripts/check_native_package.py --report .quality/native-packaging.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-packaging-evidence-${{ matrix.python }}
          path: .quality/native-packaging.json
          if-no-files-found: ignore

  compatibility:
    name: older dependencies (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
        include:
          - python: '3.13'
            numpy: '2.1.3'
            numba: '0.61.2'
          - python: '3.14'
            numpy: '2.3.5'
            numba: '0.63.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.0
      - run: uv build --wheel --out-dir .quality/compat-dist
      - name: 在旧依赖环境运行实际 wheel 的完整测试
        shell: bash
        run: |
          wheel=$(echo .quality/compat-dist/*.whl)
          uv run --isolated --no-project --python '${{ matrix.python }}' \
            --with "$wheel" --with 'numpy==${{ matrix.numpy }}' --with 'numba==${{ matrix.numba }}' \
            --with 'pytest>=8,<10' --with 'hypothesis>=6,<7' --with 'matplotlib>=3.10,<4' \
            --with 'psutil>=7,<8' --with 'ruff>=0.11,<1' python -m pytest

  dependencies:
    name: locked dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/audit.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks and scan history
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
